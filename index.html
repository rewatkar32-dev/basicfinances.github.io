<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Basic Finances | Smarter Financial Decisions</title>

  <meta name="description" content="Basic Finances helps individuals and families make smarter financial decisions through clear, goal-based investing and mutual fund guidance." />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta name="google-site-verification" content="bi6u5yfEV8bsN6X0lN-jWXTEWe7g9vhtE7riF8KZqDw" />
  <link rel="icon" href="favicon.png" />

  <style>
    /* ========== RESET ========== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f9fafb;
      color: #1f2937;
      line-height: 1.6;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* ========== HEADER ========== */
    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: #0b2e4f;
      min-height: 120px;
      padding: 16px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #ffffff;
      font-weight: 700;
    }

    .brand img {
      height: 52px;
      margin-bottom: 6px;
    }

    .brand span {
      font-size: 17px;
      letter-spacing: 0.5px;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 24px;
    }

    nav a {
      color: #ffffff;
      font-weight: 500;
    }

    nav a:hover {
      text-decoration: underline;
    }

    /* ========== HERO ========== */
    .hero {
      background: linear-gradient(135deg, #1e3a8a, #1e40af);
      color: #ffffff;
      padding: 100px 20px;
      text-align: center;
    }

    .hero h1 {
      font-size: 42px;
      margin-bottom: 16px;
    }

    .hero p {
      max-width: 760px;
      margin: 0 auto 36px;
      font-size: 18px;
      opacity: 0.95;
    }

    .hero-buttons {
      display: flex;
      justify-content: center;
      gap: 18px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 14px 28px;
      border-radius: 8px;
      font-weight: 600;
      display: inline-block;
    }

    .btn-primary {
      background: #ffffff;
      color: #1e3a8a;
    }

    .btn-secondary {
      border: 2px solid #ffffff;
      color: #ffffff;
    }

    /* ========== SECTIONS ========== */
    section {
      max-width: 1100px;
      margin: 80px auto;
      padding: 0 20px;
    }

    section h2 {
      text-align: center;
      font-size: 32px;
      margin-bottom: 40px;
      color: #1e3a8a;
    }

    /* ========== SERVICES ========== */
    .services-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 24px;
    }

    .service-card {
      background: #ffffff;
      padding: 26px;
      border-radius: 10px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.06);
    }

    .service-card h3 {
      margin-bottom: 10px;
      color: #1e3a8a;
    }

    /* ========== ABOUT US ========== */
    .about {
      background: #ffffff;
      padding: 80px 20px;
    }

    .about-container {
      max-width: 1100px;
      margin: auto;
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 50px;
      align-items: center;
    }

    .about-avatar img {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      border: 4px solid #e5e7eb;
      object-fit: cover;
    }

    /* ========== CTA ========== */
    .cta {
      background: #e0e7ff;
      padding: 60px 20px;
      text-align: center;
      border-radius: 14px;
    }

    /* ========== FOOTER ========== */
    footer {
      background: #111827;
      color: #9ca3af;
      padding: 40px 20px;
      text-align: center;
      font-size: 14px;
    }

    footer p {
      margin-bottom: 12px;
    }

    /* ========== FLOATING SOCIAL BUTTONS ========== */
    .social-float {
      position: fixed;
      right: 20px;
      bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 2000;
    }

    .social-float a {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-size: 22px;
      font-weight: bold;
      box-shadow: 0 6px 16px rgba(0,0,0,0.25);
      transition: transform 0.2s ease;
    }

    .social-float a:hover {
      transform: scale(1.08);
    }

    .whatsapp {
      background: #25D366;
    }

    .instagram {
      background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%);
    }

    .facebook {
      background: #1877F2;
    }

    /* ========== MOBILE ========== */
    @media (max-width: 768px) {
      header {
        padding: 16px 20px;
      }

      .hero h1 {
        font-size: 32px;
      }

      .about-container {
        grid-template-columns: 1fr;
        text-align: center;
      }

      nav ul {
        gap: 14px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="brand">
    <img src="images/logo.png" alt="Basic Finances Logo" />
    <span>Basic Finances</span>
  </div>

  <nav>
    <ul>
      <li><a href="#">Home</a></li>
      <li><a href="#">Learn</a></li>
      <li><a href="#">Calculators</a></li>
      <li><a href="#">About Us</a></li>
      <li><a href="#">Contact Us</a></li>
    </ul>
  </nav>
</header>

  <a href="https://www.facebook.com/profile.php?id=61579263773702" class="facebook" target="_blank" aria-label="Facebook">F</a>
</div>

<footer>

  <p>© 2026 Basic Finances. All rights reserved.</p>
</footer>

</body>
</html>
