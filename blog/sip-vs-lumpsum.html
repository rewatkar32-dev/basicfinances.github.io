<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SIP vs Lumpsum: Which Is Better? | Basic Finances</title>

  <meta name="description" content="SIP vs Lumpsum explained in simple terms. Learn which investment method suits your income, goals, and market conditions." />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" href="../favicon.png">

  <style>
    /* ================= RESET ================= */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f9fafb;
      color: #1f2937;
      line-height: 1.7;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* ================= HEADER ================= */
    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: #0b2e4f;
      padding: 14px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 18px;
      color: #ffffff;
    }

    .brand img {
      height: 38px;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 24px;
    }

    nav a {
      color: #ffffff;
      font-weight: 500;
    }

    nav a:hover {
      text-decoration: underline;
    }

    /* ================= ARTICLE ================= */
    .article-hero {
      background: #eef2ff;
      padding: 80px 20px;
      text-align: center;
    }

    .article-hero h1 {
      font-size: 40px;
      margin-bottom: 10px;
    }

    .article-hero p {
      font-size: 16px;
      color: #374151;
    }

    .article-content {
      max-width: 800px;
      margin: 70px auto;
      padding: 0 20px;
    }

    .article-content h2 {
      margin-top: 40px;
      margin-bottom: 12px;
      font-size: 26px;
      color: #1e3a8a;
    }

    .article-content p {
      margin-bottom: 18px;
      font-size: 16px;
    }

    .article-content ul {
      margin: 15px 0 25px 20px;
    }

    .article-content li {
      margin-bottom: 8px;
    }

    /* ================= CTA ================= */
    .article-cta {
      background: #e0e7ff;
      padding: 50px 20px;
      text-align: center;
      border-radius: 14px;
      margin-top: 60px;
    }

    .article-cta h3 {
      margin-bottom: 12px;
      font-size: 24px;
    }

    .article-cta a {
      display: inline-block;
      margin-top: 16px;
      padding: 12px 26px;
      border-radius: 8px;
      background: #1e3a8a;
      color: #ffffff;
      font-weight: 600;
    }

    /* ================= FOOTER ================= */
    footer {
      background: #111827;
      color: #9ca3af;
      padding: 40px 20px;
      margin-top: 80px;
    }

    .footer-content {
      max-width: 1100px;
      margin: auto;
      text-align: center;
      font-size: 14px;
    }

    .footer-content p {
      margin-bottom: 12px;
    }

    /* ================= MOBILE ================= */
    @media (max-width: 768px) {
      .article-hero h1 {
        font-size: 30px;
      }

      nav ul {
        gap: 14px;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header>

      <img src="../images/logo.png" alt="Basic Finances Logo">
      Basic Finances
